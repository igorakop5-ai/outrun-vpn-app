# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting Outrun VPN.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up Outrun VPN..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=app.Outrun VPN.com' "/usr/share/applications/Outrun VPN.desktop"
  - echo "Search and remove Outrun VPN.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/Outrun VPN.desktop" ]; then rm -f "$user_dir/.local/share/applications/Outrun VPN.desktop"; echo "Found and removed Outrun VPN.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "Outrun VPN is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Outrun VPN configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing Outrun VPN user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/Outrun VPN" ]; then rm -rf "$user_dir/.local/share/Outrun VPN"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/Outrun VPN
  - echo "Outrun VPN data cleanup complete."

